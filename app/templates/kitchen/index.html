{% extends "base.html" %}
{% block title %}Kitchen Upload - {{ branding.appName }}{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:24px auto;">
  <h2>Upload Kitchen Requirement</h2>
  <p class="text-muted">Excel or Word are read automatically. Photos/PDFs are saved for reference and filled in manually.</p>
  <form method="post" action="{{ url_for('kitchen.upload') }}" enctype="multipart/form-data">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span>Date</span><input type="date" name="date" value="{{ today }}" required></label>
    {% if not user_branch_id %}
    <label class="field">
      <span>Branch</span>
      <select name="branchId">{% for b in branches %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}</select>
    </label>
    {% endif %}
    <label class="field">
      <span>File</span>
      <input type="file" name="file" accept="image/*,.pdf,.xlsx,.xls,.docx,.doc" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block" style="height:56px;font-size:1rem;">&#128247; Upload Kitchen Requirement</button>
  </form>
</div>
{% endblock %}
