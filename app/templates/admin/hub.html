{% extends "base.html" %}
{% block title %}Admin - {{ branding.appName }}{% endblock %}
{% block content %}
<div class="card-grid" style="grid-template-columns:repeat(auto-fit, minmax(260px,1fr));max-width:700px;">
  {% for l in links %}
  <a href="{{ l.href }}" class="card" style="display:block;">
    <h3 style="margin-bottom:4px;">{{ l.label }}</h3>
    <p class="text-muted" style="font-size:0.85rem;margin:0;">{{ l.desc }}</p>
  </a>
  {% endfor %}
</div>
{% endblock %}
