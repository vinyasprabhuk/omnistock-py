---
# cPanel Git Version Control deployment file.
#
# Setup (one-time, in cPanel):
#   1. cPanel -> Git(TM) Version Control -> Create/connect this repository.
#   2. Point the repo's clone URL at wherever this project is hosted
#      (e.g. your GitHub repo) or push directly to the cPanel-hosted repo.
#   3. After the repo is connected, click "Manage" -> "Pull or Deploy" ->
#      "Deploy HEAD Commit" to run the tasks below. (cPanel does not
#      auto-run this on every push unless you separately configure a
#      webhook -- see the note at the bottom.)
#
# Deliberately does NOT run `pip install` on every deploy. This host has a
# tight memory limit that has previously OOM-killed dependency installs
# (see README.md) -- so deploys here are just "update the tracked files",
# not "reinstall the world". When a dependency genuinely changes, install
# it manually once via Terminal (with --only-binary=:all:), the same way
# the original working environment was built. Likewise, a schema change
# needs its migration script run manually once after deploying -- see
# tools/migrate_*.py.
#
# THIS BRANCH (test-deploy) ONLY -- deploys to the separate test
# subdomain, never to production. Do not merge this file's DEPLOYPATH
# section into main.
#
# Unlike production (where the Repository Path IS the live serving
# folder -- see main's .cpanel.yml for that whole story), the test
# environment's Repository Path (wherever cPanel checked this repo out
# to) is a genuinely separate directory from where the app is actually
# served (test.inventory.mokshamveg.com) -- so copying files from one to
# the other is correct here, not the self-referential mistake main's
# file made. rsync isn't installed on this host (confirmed via `which
# rsync` returning nothing), so rm+cp is used instead -- it needs no
# extra binary and gives the same "a file deleted from the repo actually
# gets removed on the server" guarantee that `rsync --delete` would.
deployment:
  tasks:
    - export DEPLOYPATH=/home/wattsupc/test.inventory.mokshamveg.com/
    - /bin/rm -rf $DEPLOYPATH/app
    - /bin/cp -R app $DEPLOYPATH/app
    - /bin/cp -R config.py $DEPLOYPATH
    - /bin/cp -R passenger_wsgi.py $DEPLOYPATH
    - /bin/cp -R wsgi.py $DEPLOYPATH
    - /bin/cp -R requirements.txt $DEPLOYPATH
    - /bin/cp -R tools $DEPLOYPATH
    # NOT copied on purpose -- these hold real data / secrets / local
    # working files and must never be overwritten by a deploy:
    #   instance/dev.db, instance/secret_key, uploads/, .venv/
    - touch /home/wattsupc/test.inventory.mokshamveg.com/tmp/restart.txt
