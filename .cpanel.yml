---
# cPanel Git Version Control deployment file.
#
# Setup (one-time, in cPanel):
#   1. cPanel -> Git(TM) Version Control -> Create/connect this repository.
#   2. Point the repo's clone URL at wherever this project is hosted
#      (e.g. your GitHub repo) or push directly to the cPanel-hosted repo.
#   3. After the repo is connected, click "Manage" -> "Pull or Deploy" ->
#      "Deploy HEAD Commit" to run the tasks below. (cPanel does not
#      auto-run this on every push unless you separately configure a
#      webhook -- see the note at the bottom.)
#
# Deliberately does NOT run `pip install` on every deploy. This host has a
# tight memory limit that has previously OOM-killed dependency installs
# (see README.md) -- so deploys here are just "update the tracked files",
# not "reinstall the world". When a dependency genuinely changes, install
# it manually once via Terminal (with --only-binary=:all:), the same way
# the original working environment was built. Likewise, a schema change
# needs its migration script run manually once after deploying -- see
# tools/migrate_*.py.
deployment:
  tasks:
    # This repo's Repository Path IS the live app folder (proven by the
    # .git directory sitting right next to passenger_wsgi.py on the
    # server) -- there is no separate staging clone to copy FROM. Every
    # earlier version of this file tried to copy app/ from a path onto
    # that exact same path (first via `rsync -a --delete app/
    # $DEPLOYPATH/app/`, which just silently no-op'd since rsync isn't
    # installed on this host -- confirmed via `which rsync` returning
    # nothing -- so app/ was never actually being touched; then via
    # `rm -rf $DEPLOYPATH/app && cp -R app $DEPLOYPATH/app`, which is
    # even worse: it deletes app/ and then tries to copy it from the
    # now-deleted source, guaranteed to fail and take the whole site
    # down with a bare `ModuleNotFoundError: No module named 'app'`.
    # This actually happened twice in production.
    #
    # The fix: don't copy anything. `git checkout -f HEAD` re-populates
    # every tracked file (including deleting ones removed from the repo,
    # e.g. the old Workstation Photos feature files, which is the exact
    # problem the old rsync/cp dance was trying and failing to solve)
    # directly from the same working directory the deploy tasks already
    # run in -- no path confusion possible. Untracked/gitignored paths
    # (instance/dev.db, instance/secret_key, instance/audit.db,
    # uploads/, .venv/, tmp/) are never touched by checkout regardless.
    - /usr/local/cpanel/3rdparty/lib/path-bin/git -C /home/wattsupc/inventory.mokshamveg.com checkout -f HEAD
    - touch /home/wattsupc/inventory.mokshamveg.com/tmp/restart.txt
